[project]
name = "forge"
version = "0.2.4"
description = "Multi-provider terminal AI coding agent"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Forge Contributors"},
]
dependencies = [
    "litellm>=1.60.0",
    "packaging>=24.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
    "textual>=5.0,<8.0",
]

[project.scripts]
forge = "forge.forge:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["forge", "forge_core"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAttributeAccessIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
